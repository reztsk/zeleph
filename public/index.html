<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Zeleph</title>
  <meta name="description" content="Zeleph : ta musique sans publicité, tes playlists et tes amis.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zeleph">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="auth" hidden></div>
  <main id="view"></main>
  <div id="mini" hidden></div>
  <nav id="tabs" aria-label="Navigation principale"></nav>
  <!-- Balise audio unique et persistante : lecture en arrière-plan et écran verrouillé (iOS). Jamais de vidéo. -->
  <audio id="audio" preload="auto" playsinline></audio>
  <noscript>Zeleph a besoin de JavaScript.</noscript>
</body>
</html>
