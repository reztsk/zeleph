# Zeleph : un seul Worker Cloudflare = PWA (fichiers statiques) + API (/api/*). Même origine → zéro CORS.
# Déploiement : `npm run deploy` (tests puis wrangler deploy).
name = "zeleph"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

# Variables non secrètes. Secrets (jamais ici) : npx wrangler secret put BREVO_API_KEY
# Sans BREVO_SENDER_EMAIL + BREVO_API_KEY, l'inscription répond 503 (« envoi des e-mails indisponible ») : aucun code ne fuit.
[vars]
BREVO_SENDER_EMAIL = "noreply@rezcollection.online"   # expéditeur validé dans Brevo (Expéditeurs, domaines & IP)
BREVO_SENDER_NAME = "Zeleph"
EXTRACTOR_URL = "https://p01--zelpeh--rnknjq6jycvp.code.run"   # extracteur audio dédié Northflank (dossier extractor/)

[[d1_databases]]
binding = "DB"
database_name = "zeleph"
database_id = "8b08ecb7-9cba-4ae7-af0c-d6a1436d1e4c"

# Cache des flux audio résolus (~4 h) partagé entre data centers.
[[kv_namespaces]]
binding = "CACHE"
id = "8dbae757c8634543b36a847c2566c393"
